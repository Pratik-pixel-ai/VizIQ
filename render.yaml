services:
  # Backend Web Service (Spring Boot)
  - type: web
    name: viziq-backend
    env: docker
    rootDir: backend/backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080

  # Frontend Static Site (Vite React)
  - type: web
    name: viziq-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: viziq-backend
          property: url
